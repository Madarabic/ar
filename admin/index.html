<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - MADARABIC</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
  <nav class="bg-slate-900 text-white p-4 flex justify-between items-center">
    <span class="font-bold text-lg">MADARABIC - Panel Admin</span>
    <button onclick="logout()" class="bg-red-600 px-3 py-1 rounded text-sm">Keluar</button>
  </nav>

  <div class="max-w-6xl mx-auto p-4 space-y-6">
    <div class="flex gap-4 border-b pb-2">
      <a href="index.html" class="font-bold text-slate-900 underline">Ringkasan Statistik</a>
      <a href="enrollments.html" class="text-gray-600">Persetujuan Pendaftaran (Enrollments)</a>
    </div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded border text-center">
        <p class="text-xs text-gray-500">Total Pengguna</p>
        <span id="stUsers" class="text-3xl font-bold text-slate-800">0</span>
      </div>
      <div class="bg-white p-4 rounded border text-center">
        <p class="text-xs text-gray-500">Total Kursus</p>
        <span id="stCourses" class="text-3xl font-bold text-slate-800">0</span>
      </div>
      <div class="bg-white p-4 rounded border text-center">
        <p class="text-xs text-gray-500">Total Pendaftaran</p>
        <span id="stEnrollments" class="text-3xl font-bold text-slate-800">0</span>
      </div>
      <div class="bg-white p-4 rounded border text-center">
        <p class="text-xs text-gray-500">Sertifikat Terbit</p>
        <span id="stCerts" class="text-3xl font-bold text-emerald-700">0</span>
      </div>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script>
    checkAuth('Admin');
    async function loadStats() {
      const res = await apiCall('getAdminStats', 'GET');
      if (res.status === 'success') {
        document.getElementById('stUsers').innerText = res.stats.totalUsers;
        document.getElementById('stCourses').innerText = res.stats.totalCourses;
        document.getElementById('stEnrollments').innerText = res.stats.totalEnrollments;
        document.getElementById('stCerts').innerText = res.stats.totalCertificates;
      }
    }
    loadStats();
  </script>
</body>
</html>
