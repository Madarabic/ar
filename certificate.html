<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi Sertifikat - MADARABIC</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-6 rounded border border-gray-300 w-full max-w-lg text-center shadow-sm">
    <h1 class="text-2xl font-bold text-blue-900 mb-1">MADARABIC</h1>
    <p class="text-xs text-gray-500 mb-6">Verifikasi Keabsahan Sertifikat Digital</p>

    <div class="flex gap-2 mb-6">
      <input type="text" id="certInput" placeholder="Masukkan Kode Sertifikat (contoh: CERT-MADARABIC-123456)" class="p-2 border rounded text-xs flex-1">
      <button onclick="checkManual()" class="bg-blue-900 text-white px-4 py-2 rounded text-xs">Cek</button>
    </div>

    <div id="statusResult" class="hidden border p-4 rounded text-left space-y-2 text-sm bg-gray-50"></div>
  </div>

  <script src="assets/js/config.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const codeParam = urlParams.get('code');

    if (codeParam) {
      document.getElementById('certInput').value = codeParam;
      verifyCode(codeParam);
    }

    function checkManual() {
      const code = document.getElementById('certInput').value;
      if (code) verifyCode(code);
    }

    async function verifyCode(code) {
      const resEl = document.getElementById('statusResult');
      resEl.classList.remove('hidden');
      resEl.innerHTML = '<p class="text-gray-500 text-center">Memeriksa keabsahan kode...</p>';

      const res = await apiCall('verifyCertificate', 'GET', { code: code });

      if (res.status === 'success' && res.valid) {
        const d = res.data;
        resEl.innerHTML = `
          <div class="text-center font-bold text-green-700 mb-2">VALID / RESMI</div>
          <p><b>Nama Siswa:</b> ${d.studentName}</p>
          <p><b>Kursus:</b> ${d.courseTitle}</p>
          <p><b>Nilai Akhir Rata-Rata:</b> ${d.finalAverageScore} / 100</p>
          <p><b>Tanggal Terbit:</b> ${new Date(d.issueDate).toLocaleDateString('id-ID')}</p>
          <a href="${d.pdfUrl}" target="_blank" class="block text-center mt-3 bg-emerald-700 text-white py-2 rounded text-xs">Buka Dokumen PDF Resmian</a>
        `;
      } else {
        resEl.innerHTML = '<div class="text-center font-bold text-red-600">KODE SERTIFIKAT TIDAK DITEMUKAN / TIDAK VALID</div>';
      }
    }
  </script>
</body>
</html>
