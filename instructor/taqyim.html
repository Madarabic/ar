<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taqyim & Evaluasi - MADARABIC</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
  <nav class="bg-emerald-900 text-white p-4 flex justify-between items-center">
    <span class="font-bold text-lg">MADARABIC - Panel Taqyim (Penilaian)</span>
    <button onclick="logout()" class="bg-red-600 px-3 py-1 rounded text-sm">Keluar</button>
  </nav>

  <div class="max-w-6xl mx-auto p-4 space-y-6">
    <div class="flex gap-4">
      <a href="index.html" class="text-gray-600">Manajemen Modul & Tugas</a>
      <a href="taqyim.html" class="font-bold text-emerald-900 underline">Modul Penilaian (Taqyim)</a>
    </div>

    <div class="bg-white p-4 rounded border">
      <h3 class="font-bold text-lg mb-4">Daftar Kiriman Tugas Siswa</h3>
      <div id="subList" class="space-y-4"></div>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script>
    const user = checkAuth('Instructor');

    async function loadSubmissions() {
      const res = await apiCall('getSubmissionsForGrading', 'GET');
      const list = document.getElementById('subList');
      list.innerHTML = '';

      if (res.status === 'success' && res.data.length > 0) {
        res.data.forEach(s => {
          list.innerHTML += `
            <div class="p-4 border rounded bg-gray-50 space-y-3">
              <div class="flex justify-between border-b pb-2">
                <div>
                  <b class="text-lg text-blue-900">${s.studentName}</b>
                  <p class="text-xs text-gray-500">Tugas: [${s.skillType}] ${s.assignmentTitle}</p>
                </div>
                <span class="px-2 py-1 rounded text-xs font-bold ${s.status === 'GRADED' ? 'bg-green-100 text-green-800' : 'bg-amber-100 text-amber-800'}">${s.status}</span>
              </div>

              <!-- Jawaban Siswa -->
              <div class="p-2 bg-white rounded border text-sm space-y-2">
                ${s.textAnswer ? `<p><b>Jawaban Teks:</b> ${s.textAnswer}</p>` : ''}
                ${s.fileUrl ? `<p><a href="${s.fileUrl}" target="_blank" class="text-blue-600 underline text-xs">Buka Dokumen Tugas File</a></p>` : ''}
                ${s.audioUrl ? `<div><b>Rekaman Suara Kalam (Voice Note):</b><br/><audio controls src="${s.audioUrl}" class="mt-1 h-8 w-full"></audio></div>` : ''}
              </div>

              <!-- Form Penilaian 4 Skill -->
              <form onsubmit="saveGrade(event, '${s.submissionId}', '${s.courseId}')" class="bg-white p-3 border rounded grid grid-cols-2 md:grid-cols-4 gap-2 text-xs">
                <div>
                  <label>Nilai Istima' (0-100):</label>
                  <input type="number" id="lis_${s.submissionId}" value="${s.scoreListening}" min="0" max="100" required class="w-full p-1 border rounded">
                </div>
                <div>
                  <label>Nilai Kalam (0-100):</label>
                  <input type="number" id="spk_${s.submissionId}" value="${s.scoreSpeaking}" min="0" max="100" required class="w-full p-1 border rounded">
                </div>
                <div>
                  <label>Nilai Qira'ah (0-100):</label>
                  <input type="number" id="rdg_${s.submissionId}" value="${s.scoreReading}" min="0" max="100" required class="w-full p-1 border rounded">
                </div>
                <div>
                  <label>Nilai Kitabah (0-100):</label>
                  <input type="number" id="wrt_${s.submissionId}" value="${s.scoreWriting}" min="0" max="100" required class="w-full p-1 border rounded">
                </div>
                <div class="col-span-2 md:col-span-4">
                  <input type="text" id="fb_${s.submissionId}" value="${s.feedback}" placeholder="Catatan / Feedback Pengajar" class="w-full p-1 border rounded">
                </div>
                <button type="submit" class="col-span-2 md:col-span-4 bg-emerald-800 text-white py-1 rounded font-semibold">Simpan Penilaian Taqyim</button>
              </form>
            </div>
          `;
        });
      } else {
        list.innerHTML = '<p class="text-gray-500">Belum ada tugas yang dikirimkan siswa.</p>';
      }
    }

    async function saveGrade(e, subId, courseId) {
      e.preventDefault();
      const res = await apiCall('gradeTaqyimSubmission', 'POST', {
        submissionId: subId,
        courseId: courseId,
        scoreListening: document.getElementById(`lis_${subId}`).value,
        scoreSpeaking: document.getElementById(`spk_${subId}`).value,
        scoreReading: document.getElementById(`rdg_${subId}`).value,
        scoreWriting: document.getElementById(`wrt_${subId}`).value,
        feedback: document.getElementById(`fb_${subId}`).value
      });
      alert(res.message);
      loadSubmissions();
    }

    loadSubmissions();
  </script>
</body>
</html>
