<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MADARABIC LMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-6 rounded border border-gray-300 w-full max-w-md shadow-sm">
    <h1 class="text-2xl font-bold text-center text-blue-900 mb-1">MADARABIC LMS</h1>
    <p class="text-sm text-center text-gray-600 mb-6">Sistem Pembelajaran Bahasa Arab Online</p>

    <div id="alert" class="hidden p-3 mb-4 text-sm text-white rounded bg-red-600"></div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="email" required class="w-full mt-1 p-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" required class="w-full mt-1 p-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500">
      </div>
      <button type="submit" id="btnSubmit" class="w-full bg-blue-900 text-white py-2 rounded hover:bg-blue-800 transition">Masuk</button>
    </form>

    <p class="mt-4 text-center text-sm text-gray-600">
      Belum punya akun? <a href="register.html" class="text-blue-700 font-semibold underline">Daftar Sekarang</a>
    </p>
  </div>

  <script src="assets/js/config.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      const alert = document.getElementById('alert');
      alert.classList.add('hidden');
      btn.innerText = 'Memproses...';
      btn.disabled = true;

      const res = await apiCall('login', 'POST', {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      });

      if (res.status === 'success') {
        localStorage.setItem('madarabic_user', JSON.stringify(res.user));
        if (res.user.role === 'Admin') window.location.href = 'admin/index.html';
        else if (res.user.role === 'Instructor') window.location.href = 'instructor/index.html';
        else window.location.href = 'student/index.html';
      } else {
        alert.innerText = res.message || 'Login gagal';
        alert.classList.remove('hidden');
        btn.innerText = 'Masuk';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
