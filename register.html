<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi - MADARABIC LMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-6 rounded border border-gray-300 w-full max-w-md shadow-sm">
    <h1 class="text-2xl font-bold text-center text-blue-900 mb-1">Daftar MADARABIC</h1>
    <p class="text-sm text-center text-gray-600 mb-6">Buat akun untuk memulai pembelajaran</p>

    <div id="alert" class="hidden p-3 mb-4 text-sm text-white rounded bg-red-600"></div>

    <form id="regForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Nama Lengkap</label>
        <input type="text" id="name" required class="w-full mt-1 p-2 border border-gray-300 rounded">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="email" required class="w-full mt-1 p-2 border border-gray-300 rounded">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" required class="w-full mt-1 p-2 border border-gray-300 rounded">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Role / Peran</label>
        <select id="role" class="w-full mt-1 p-2 border border-gray-300 rounded">
          <option value="Student">Siswa (Student)</option>
          <option value="Instructor">Pengajar (Instructor)</option>
        </select>
      </div>
      <button type="submit" id="btnSubmit" class="w-full bg-emerald-700 text-white py-2 rounded hover:bg-emerald-800 transition">Daftar Akun</button>
    </form>

    <p class="mt-4 text-center text-sm text-gray-600">
      Sudah punya akun? <a href="login.html" class="text-blue-700 font-semibold underline">Login</a>
    </p>
  </div>

  <script src="assets/js/config.js"></script>
  <script>
    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      const alert = document.getElementById('alert');
      alert.classList.add('hidden');
      btn.innerText = 'Mendaftar...';
      btn.disabled = true;

      const res = await apiCall('register', 'POST', {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        role: document.getElementById('role').value
      });

      if (res.status === 'success') {
        alert.classList.remove('hidden', 'bg-red-600');
        alert.classList.add('bg-green-600');
        alert.innerText = 'Registrasi berhasil! Mengalihkan ke login...';
        setTimeout(() => window.location.href = 'login.html', 1500);
      } else {
        alert.innerText = res.message || 'Registrasi gagal';
        alert.classList.remove('hidden');
        btn.innerText = 'Daftar Akun';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
